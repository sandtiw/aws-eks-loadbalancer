apiVersion: v1
kind: Service
metadata:
  name: aws-demo-service-clusters
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /myapp/api/health
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/success-codes: "200" 
spec:
  type: ClusterIP
  selector:
    app: aws-demo
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080